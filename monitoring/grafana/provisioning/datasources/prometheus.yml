# The datasource is provisioned from the repo rather than added by hand in the
# UI, so a fresh clone comes up with a working dashboard and there is nothing to
# forget. The uid is fixed so an imported dashboard can reference it by name.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
