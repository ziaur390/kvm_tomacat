---
- name: Install Tomcat 10
  ansible.builtin.apt:
    name: tomcat10
    state: present

- name: Ensure Tomcat is enabled and running
  ansible.builtin.service:
    name: tomcat10
    state: started
    enabled: true

# Tomcat auto-deploys anything dropped into webapps/, and the filename minus
# .war becomes the context path, so this single copy is the whole deployment -
# no restart, no manager URL.
- name: Deploy the lab WAR
  ansible.builtin.copy:
    src: labapp.war
    dest: /var/lib/tomcat10/webapps/labapp.war
    owner: tomcat
    group: tomcat
    mode: "0644"

# The first request to a JSP is slow because Tomcat compiles it, so this waits
# rather than failing on the first attempt.
- name: Wait until the app answers its health check
  ansible.builtin.uri:
    url: http://localhost:8080/labapp/health
    status_code: 200
  register: health
  until: health.status == 200
  retries: 12
  delay: 5
  changed_when: false
