---
- name: Install backup script
  ansible.builtin.copy:
    src: tomcat-backup.sh
    dest: /usr/local/bin/tomcat-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Install backup service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - tomcat-backup.service
    - tomcat-backup.timer

# daemon_reload is needed because the unit files above are new or changed.
- name: Enable the timer
  ansible.builtin.systemd:
    name: tomcat-backup.timer
    enabled: true
    state: started
    daemon_reload: true
